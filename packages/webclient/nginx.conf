# Harness Web Client — nginx configuration
#
# Serves static assets and reverse-proxies API/WebSocket requests
# to the harness backend server. This gives the browser a single
# origin (no CORS issues) and cleanly separates frontend from backend.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Static assets ──────────────────────────────────────────
    # SPA fallback: serve index.html for any path that doesn't match a file
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, sourcemaps)
    location ~* \.(js|css|map|ico|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Reverse proxy: REST API ────────────────────────────────
    location /api/ {
        proxy_pass http://harness:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running tasks
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Reverse proxy: Health check ────────────────────────────
    location = /health {
        proxy_pass http://harness:3000;
        proxy_set_header Host $host;
    }

    # ── Reverse proxy: WebSocket ───────────────────────────────
    location = /ws {
        proxy_pass http://harness:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket connections can be long-lived
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
