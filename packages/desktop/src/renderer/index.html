<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Harness Desktop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top bar -->
  <header id="top-bar">
    <div class="top-bar-left">
      <span class="logo">HARNESS</span>
      <span id="status-badge" class="badge badge-idle">idle</span>
    </div>
    <div class="top-bar-center">
      <nav id="tab-nav">
        <button class="tab active" data-panel="chat">Chat</button>
        <button class="tab" data-panel="tools">Tools</button>
        <button class="tab" data-panel="skills">Skills</button>
        <button class="tab" data-panel="plugins">Plugins</button>
        <button class="tab" data-panel="telemetry">Telemetry</button>
        <button class="tab" data-panel="events">Events</button>
        <button class="tab" data-panel="sessions">Sessions</button>
        <button class="tab" data-panel="settings">Settings</button>
      </nav>
    </div>
    <div class="top-bar-right">
      <span id="model-label" class="meta-label">--</span>
      <span id="token-label" class="meta-label">0 tokens</span>
    </div>
  </header>

  <!-- Main content area -->
  <main id="main-content">

    <!-- ═══ Chat Panel ═══ -->
    <section id="panel-chat" class="panel active">
      <div id="chat-messages" class="chat-messages"></div>
      <div id="feedback-bar" class="feedback-bar hidden">
        <div id="feedback-content"></div>
      </div>
      <form id="chat-form" class="chat-input-area">
        <textarea id="chat-input" placeholder="Enter a task for the agent..." rows="2"></textarea>
        <div class="chat-input-controls">
          <select id="provider-select">
            <option value="anthropic">Anthropic</option>
            <option value="openai">OpenAI</option>
            <option value="ollama">Ollama</option>
          </select>
          <input id="model-input" type="text" placeholder="model (optional)" />
          <button type="submit" id="run-btn" class="btn btn-primary">Run</button>
        </div>
      </form>
    </section>

    <!-- ═══ Tools Panel ═══ -->
    <section id="panel-tools" class="panel">
      <div class="panel-header">
        <h2>Registered Tools</h2>
        <button id="tools-refresh" class="btn btn-small">Refresh</button>
      </div>
      <div id="tools-list" class="card-grid"></div>
      <div class="panel-header" style="margin-top: 1rem;">
        <h2>Tool Execution Log</h2>
      </div>
      <div id="tools-log" class="log-area"></div>
    </section>

    <!-- ═══ Skills Panel ═══ -->
    <section id="panel-skills" class="panel">
      <div class="panel-header">
        <h2>Skills</h2>
        <button id="skills-refresh" class="btn btn-small">Refresh</button>
      </div>
      <div id="skills-list" class="card-grid"></div>
    </section>

    <!-- ═══ Plugins Panel ═══ -->
    <section id="panel-plugins" class="panel">
      <div class="panel-header">
        <h2>Loaded Plugins</h2>
        <button id="plugins-refresh" class="btn btn-small">Refresh</button>
      </div>
      <div id="plugins-list" class="card-grid"></div>
    </section>

    <!-- ═══ Telemetry Panel ═══ -->
    <section id="panel-telemetry" class="panel">
      <div class="panel-header">
        <h2>Telemetry</h2>
        <button id="telemetry-refresh" class="btn btn-small">Refresh</button>
      </div>
      <div id="telemetry-stats" class="stats-grid"></div>
      <div class="panel-header" style="margin-top: 1rem;">
        <h2>Token Usage Over Time</h2>
      </div>
      <div id="telemetry-chart" class="chart-area"></div>
    </section>

    <!-- ═══ Events Panel ═══ -->
    <section id="panel-events" class="panel">
      <div class="panel-header">
        <h2>Live Event Stream</h2>
        <div>
          <label><input type="checkbox" id="events-auto-scroll" checked /> Auto-scroll</label>
          <button id="events-clear" class="btn btn-small">Clear</button>
        </div>
      </div>
      <div id="events-stream" class="log-area"></div>
    </section>

    <!-- ═══ Sessions Panel ═══ -->
    <section id="panel-sessions" class="panel">
      <div class="panel-header">
        <h2>Session History</h2>
        <button id="sessions-refresh" class="btn btn-small">Refresh</button>
      </div>
      <div id="sessions-list" class="sessions-list"></div>
      <div id="session-detail" class="session-detail hidden"></div>
    </section>

    <!-- ═══ Settings Panel ═══ -->
    <section id="panel-settings" class="panel">
      <div class="panel-header">
        <h2>Settings</h2>
        <span id="settings-status" class="settings-status"></span>
      </div>
      <div class="settings-form">

        <div class="settings-section">
          <h3>API Keys</h3>

          <div class="settings-field">
            <label class="settings-label" for="settings-openai-key">OpenAI API Key</label>
            <div class="settings-input-row">
              <input id="settings-openai-key" type="password" class="settings-input" placeholder="sk-..." autocomplete="off" />
              <button class="btn btn-small settings-toggle-vis" data-target="settings-openai-key">Show</button>
            </div>
          </div>

          <div class="settings-field">
            <label class="settings-label" for="settings-openai-base-url">OpenAI Base URL <span class="text-muted">(optional)</span></label>
            <input id="settings-openai-base-url" type="text" class="settings-input" placeholder="https://api.openai.com/v1" autocomplete="off" />
          </div>

          <div class="settings-field">
            <label class="settings-label" for="settings-anthropic-key">Anthropic API Key</label>
            <div class="settings-input-row">
              <input id="settings-anthropic-key" type="password" class="settings-input" placeholder="sk-ant-..." autocomplete="off" />
              <button class="btn btn-small settings-toggle-vis" data-target="settings-anthropic-key">Show</button>
            </div>
          </div>

          <div class="settings-field">
            <label class="settings-label" for="settings-ollama-url">Ollama Base URL</label>
            <input id="settings-ollama-url" type="text" class="settings-input" placeholder="http://localhost:11434" autocomplete="off" />
          </div>
        </div>

        <div class="settings-section">
          <h3>Defaults</h3>

          <div class="settings-field">
            <label class="settings-label" for="settings-default-provider">Default Provider</label>
            <select id="settings-default-provider" class="settings-input">
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic</option>
              <option value="ollama">Ollama</option>
            </select>
          </div>

          <div class="settings-field">
            <label class="settings-label" for="settings-default-model">Default Model</label>
            <input id="settings-default-model" type="text" class="settings-input" placeholder="gpt-4o, claude-sonnet-4-5-20250929, llama3.2..." autocomplete="off" />
          </div>

          <div class="settings-row">
            <div class="settings-field">
              <label class="settings-label" for="settings-temperature">Temperature</label>
              <input id="settings-temperature" type="number" class="settings-input" min="0" max="2" step="0.1" placeholder="0.7" />
            </div>
            <div class="settings-field">
              <label class="settings-label" for="settings-max-iterations">Max Iterations</label>
              <input id="settings-max-iterations" type="number" class="settings-input" min="1" max="100" step="1" placeholder="25" />
            </div>
            <div class="settings-field">
              <label class="settings-label" for="settings-max-tokens">Max Tokens</label>
              <input id="settings-max-tokens" type="number" class="settings-input" min="1" max="100000" step="1" placeholder="4096" />
            </div>
          </div>
        </div>

        <div class="settings-actions">
          <button id="settings-save" class="btn btn-primary">Save Settings</button>
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
